<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Amortização</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Simulador de Amortização - DFA Defense LTDA</h1>
    </header>
    <main>
        <section id="informacoesContratuais">
            <h2>Informações Contratuais</h2>
            <div>
                <label for="valorPrincipal">Valor Principal (R$):</label>
                <input type="number" id="valorPrincipal" name="valorPrincipal">
            </div>
            <div>
                <label for="dataInicio">Data Início:</label>
                <input type="date" id="dataInicio" name="dataInicio">
            </div>
            <div>
                <label for="taxaSpreadMensal">Taxa Spread Mensal (%):</label>
                <input type="number" id="taxaSpreadMensal" name="taxaSpreadMensal" placeholder="0.0045">
            </div>
        </section>

        <section id="parametrosProjecao">
            <h2>Parâmetros de Projeção</h2>
            <div>
                <label for="taxaCdiMensalProjecao">Taxa CDI mensal para projeção (%):</label>
                <input type="number" id="taxaCdiMensalProjecao" name="taxaCdiMensalProjecao" placeholder="0.90">
            </div>
        </section>

        <div id="botoesAcao">
            <button id="btnCalcularAmortizacao">Calcular Amortização</button>
            <button id="btnExportarExcel">Exportar para Excel</button>
            <button id="btnVisualizarResumo">Visualizar Resumo</button>
        </div>

        <div id="containerTabelaAmortizacao">
            <table id="tabelaAmortizacao">
                <thead>
                    <tr>
                        <th>Parcela</th>
                        <th>Vencimento</th>
                        <th>% Amort.</th>
                        <th>CDI (%)</th>
                        <th>Taxa Total (%)</th>
                        <th>Saldo Inicial</th>
                        <th>Juros</th>
                        <th>Amortização</th>
                        <th>Parcela Total</th>
                        <th>Saldo Final</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaAmortizacao">
                    <!-- Linhas da tabela serão inseridas aqui via JavaScript -->
                </tbody>
            </table>
        </div>

        <div id="resumoCalculo">
            <h2>Resumo do Cálculo</h2>
            <pre id="dadosResumo">
                <!-- Resumo será exibido aqui -->
            </pre>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
